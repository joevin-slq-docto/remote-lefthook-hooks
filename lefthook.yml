pre-commit:
  jobs:
  - name: setup mise
    script: setup.sh
  - name: prettier and ggshield
    group:
      parallel: true
      jobs:
      - name: prettier
        glob: "*.{js,ts,jsx,tsx}"
        args: "{staged_files}"
        script: prettier.sh
      - name: ggshield
        script: ggshield.sh