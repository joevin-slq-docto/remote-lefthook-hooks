pre-commit:
  jobs:
  - name: setup mise
    run: |
      cd .git/info/lefthook-remotes/main
      mise trust -q && mise install -q
  - name: prettier and ggshield
    group:
      parallel: true
      jobs:
      - name: prettier
        glob: "*.{js,ts,jsx,tsx}"
        run: |
          export REMOTE_HOOKS_DIR=".git/info/lefthook-remotes/main"
          eval "$(mise -C $REMOTE_HOOKS_DIR env)"
          prettier --check {staged_files}
      - name: ggshield
        run: |
          export REMOTE_HOOKS_DIR=".git/info/lefthook-remotes/main"
          eval "$(mise -C $REMOTE_HOOKS_DIR env)"
          bash $REMOTE_HOOKS_DIR/ggshield.sh